<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Biométrico Forense - Standalone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #0a0e27; color: #00ff00; padding: 20px; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { border: 2px solid #00ff00; padding: 20px; margin-bottom: 30px; background: #0f1a3d; }
    h1 { font-size: 24px; margin-bottom: 5px; text-shadow: 0 0 10px #00ff00; }
    .subtitle { color: #00aa00; font-size: 12px; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .panel { border: 2px solid #00ff00; padding: 20px; background: #0f1a3d; }
    .panel h2 { font-size: 16px; margin-bottom: 15px; color: #00ff00; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
    .upload-area { border: 2px dashed #00ff00; padding: 30px; text-align: center; cursor: pointer; background: rgba(0, 255, 0, 0.05); }
    .upload-area.dragover { background: rgba(0, 255, 0, 0.2); }
    input[type="file"] { display: none; }
    .button { background: #00ff00; color: #0a0e27; border: none; padding: 10px 20px; margin-top: 10px; margin-right: 10px; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; font-size: 12px; }
    .button:hover { background: #00aa00; box-shadow: 0 0 10px #00ff00; }
    .button:disabled { background: #666; cursor: not-allowed; opacity: 0.5; }
    .button-download { background: #00aa00; color: #fff; border: 1px solid #00ff00; width: 100%; margin-top: 20px; padding: 15px; display: none; }
    .preview img, .comparison-item img { max-width: 100%; border: 1px solid #00ff00; margin-bottom: 10px; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .loading { display: none; text-align: center; margin: 20px 0; }
    .success { background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; padding: 10px; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔬 PANEL BIOMÉTRICO FORENSE</h1>
      <p class="subtitle">Standalone Edition - Procesamiento Local (v2.0.1-FINAL)</p>
    </header>
    <div class="content">
      <div class="panel">
        <h2>📤 Cargar Huella</h2>
        <div class="upload-area" id="uploadArea">
          <p>Arrastra una imagen aquí o haz clic para seleccionar</p>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="preview" id="preview"></div>
        <div class="button-group">
          <button class="button" id="processBtn" disabled>⚙️ PROCESAR Y PREPARAR DESCARGA</button>
        </div>
        <div class="loading" id="loading"><p>Procesando...</p></div>
        <div id="message"></div>
      </div>
      <div class="panel">
        <h2>📊 Resultado</h2>
        <div id="noResults">Carga una huella para procesar</div>
        <div id="resultArea" style="display: none;">
          <div class="comparison">
            <div class="comparison-item"><img id="originalImg"><p>ORIGINAL</p></div>
            <div class="comparison-item"><img id="processedImg"><p>PROCESADA</p></div>
          </div>
          <button class="button button-download" id="downloadBtn">📥 DESCARGAR PNG FINAL</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const preview = document.getElementById('preview');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const resultArea = document.getElementById('resultArea');
    const noResults = document.getElementById('noResults');
    
    let currentFile = null;
    let finalBlob = null;

    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = (e) => e.target.files[0] && handleFile(e.target.files[0]);
    
    function handleFile(file) {
      currentFile = file;
      processBtn.disabled = false;
      const reader = new FileReader();
      reader.onload = (e) => preview.innerHTML = `<img src="${e.target.result}">`;
      reader.readAsDataURL(file);
    }

    processBtn.onclick = async () => {
      if (!currentFile) return;
      loading.style.display = 'block';
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          
          // PROCESAMIENTO FORENSE REAL
          ctx.filter = 'grayscale(100%) contrast(250%) brightness(110%) invert(100%)';
          ctx.drawImage(img, 0, 0);
          
          // CAPTURA DEL BLOB PARA DESCARGA SEGURA
          canvas.toBlob((blob) => {
            finalBlob = blob;
            const processedUrl = URL.createObjectURL(blob);
            
            document.getElementById('originalImg').src = e.target.result;
            document.getElementById('processedImg').src = processedUrl;
            
            resultArea.style.display = 'block';
            noResults.style.display = 'none';
            downloadBtn.style.display = 'block';
            loading.style.display = 'none';
            message.innerHTML = '<div class="success">✓ Huella procesada y lista para descargar</div>';
          }, 'image/png');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(currentFile);
    };

    downloadBtn.onclick = () => {
      if (!finalBlob) {
        alert("Error: No se ha generado el archivo de descarga. Por favor, procesa la imagen de nuevo.");
        return;
      }
      const url = window.URL.createObjectURL(finalBlob);
      const link = document.createElement('a');
      link.style.display = 'none';
      link.href = url;
      link.setAttribute('download', `HUELLA_FORENSE_${Date.now()}.png`);
      document.body.appendChild(link);
      link.click();
      setTimeout(() => {
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
      }, 200);
    };
  </script>
</body>
</html>
