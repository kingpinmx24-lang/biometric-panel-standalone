<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA REPARADO - V3 - Panel Biométrico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #0a0e27; color: #00ff00; padding: 20px; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { border: 2px solid #00ff00; padding: 20px; margin-bottom: 30px; background: #0f1a3d; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 5px; text-shadow: 0 0 10px #00ff00; }
    .status-badge { background: #ff0000; color: #fff; padding: 5px 10px; font-weight: bold; border-radius: 3px; font-size: 14px; margin-top: 10px; display: inline-block; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .panel { border: 2px solid #00ff00; padding: 20px; background: #0f1a3d; }
    .panel h2 { font-size: 16px; margin-bottom: 15px; color: #00ff00; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
    .upload-area { border: 2px dashed #00ff00; padding: 30px; text-align: center; cursor: pointer; background: rgba(0, 255, 0, 0.05); }
    .upload-area.dragover { background: rgba(0, 255, 0, 0.2); }
    input[type="file"] { display: none; }
    .button { background: #00ff00; color: #0a0e27; border: none; padding: 15px 25px; margin-top: 10px; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; font-size: 14px; width: 100%; }
    .button:hover { background: #00aa00; box-shadow: 0 0 15px #00ff00; }
    .button:disabled { background: #666; cursor: not-allowed; opacity: 0.5; }
    .preview img, .comparison-item img { max-width: 100%; border: 1px solid #00ff00; margin-top: 15px; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .loading { display: none; text-align: center; margin: 20px 0; font-weight: bold; color: #ffff00; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔬 PANEL BIOMÉTRICO FORENSE</h1>
      <div class="status-badge">SISTEMA REPARADO - V3 (BYPASS CACHE)</div>
    </header>
    <div class="content">
      <div class="panel">
        <h2>1. CARGAR HUELLA</h2>
        <div class="upload-area" id="uploadArea">
          <p>Haz clic aquí para seleccionar la huella</p>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="preview" id="preview"></div>
        <button class="button" id="processBtn" disabled>⚙️ PROCESAR Y DESCARGAR AHORA</button>
        <div class="loading" id="loading">PROCESANDO... POR FAVOR ESPERA</div>
      </div>
      <div class="panel">
        <h2>2. RESULTADO FINAL</h2>
        <div id="resultArea" style="display: none;">
          <div class="comparison">
            <div class="comparison-item"><img id="originalImg"><p>ORIGINAL</p></div>
            <div class="comparison-item"><img id="processedImg"><p>PROCESADA (VISTA)</p></div>
          </div>
          <p style="margin-top: 15px; color: #ffff00; font-size: 12px;">✓ La descarga se iniciará automáticamente al terminar el proceso.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const preview = document.getElementById('preview');
    const loading = document.getElementById('loading');
    const resultArea = document.getElementById('resultArea');
    
    let currentFile = null;

    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      if (e.target.files[0]) {
        currentFile = e.target.files[0];
        processBtn.disabled = false;
        const reader = new FileReader();
        reader.onload = (ev) => preview.innerHTML = `<img src="${ev.target.result}">`;
        reader.readAsDataURL(currentFile);
      }
    };

    processBtn.onclick = async () => {
      if (!currentFile) return;
      loading.style.display = 'block';
      processBtn.disabled = true;
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          
          // FILTRO FORENSE ULTRA-NÍTIDO (CLIENTE)
          ctx.filter = 'grayscale(100%) contrast(300%) brightness(110%) invert(100%)';
          ctx.drawImage(img, 0, 0);
          
          // MOSTRAR EN PANTALLA
          const processedData = canvas.toDataURL('image/png');
          document.getElementById('originalImg').src = e.target.result;
          document.getElementById('processedImg').src = processedData;
          resultArea.style.display = 'block';
          
          // DESCARGA AUTOMÁTICA SEGURA (BLOB)
          canvas.toBlob((blob) => {
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `HUELLA_FORENSE_V3_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
              document.body.removeChild(link);
              window.URL.revokeObjectURL(url);
              loading.style.display = 'none';
              processBtn.disabled = false;
            }, 500);
          }, 'image/png');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(currentFile);
    };
  </script>
</body>
</html>
